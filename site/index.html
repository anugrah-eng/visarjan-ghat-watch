<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visarjan Ghat Watch · Bhopal</title>
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Visarjan Ghat Watch</h1>
      <span class="sub">Bhopal · MPPCB water tests 2023–25 checked against CPCB bathing limits (Class B)</span>
    </div>
    <div class="countdown" id="countdown"></div>
    <div class="top-actions">
      <button id="btn-upload" class="btn">⬆ Upload report</button>
      <button id="btn-brief" class="btn btn-primary">Officer brief · EN / हिंदी</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar" id="sidebar">
      <section id="view-list">
        <div class="side-head">
          <h2>Ghats ranked by risk</h2>
          <p class="muted" id="data-note"></p>
        </div>
        <ol class="ghat-list" id="ghat-list"></ol>
        <div class="side-buttons">
          <button class="btn" id="btn-report">CPCB report: pH, DO, BOD</button>
          <button class="btn" id="btn-export-summary">⬇ Export ranking CSV</button>
          <button class="btn" id="btn-export-all">⬇ Export all readings CSV</button>
        </div>
        <details class="limits" id="limits-box" open>
          <summary>What this data does not tell you</summary>
          <ul id="limits-list"></ul>
        </details>
      </section>
      <section id="view-detail" hidden></section>
      <section id="view-report" hidden></section>
    </aside>
    <div class="map-wrap">
      <div id="map" aria-label="Map of Bhopal immersion ghats"></div>
      <div class="legend" id="legend"></div>
      <div class="map-notice" id="map-notice" hidden>Map tiles unavailable offline. The list, report and brief still work.</div>
    </div>
  </main>

  <dialog id="dlg-brief" class="dlg">
    <div class="dlg-head">
      <h2>Officer brief</h2>
      <div class="seg" role="tablist">
        <button data-lang="en" class="on">English</button>
        <button data-lang="hi">हिंदी</button>
        <button data-lang="both">Both</button>
      </div>
      <button class="x" data-close>✕</button>
    </div>
    <div id="brief-body" class="brief"></div>
    <div class="dlg-foot">
      <span class="muted" id="brief-status"></span>
      <button class="btn" id="btn-copy">Copy for WhatsApp</button>
      <button class="btn btn-primary" id="btn-print">Print / Save as PDF</button>
    </div>
  </dialog>

  <dialog id="dlg-upload" class="dlg dlg-wide">
    <div class="dlg-head">
      <h2>Upload a new MPPCB report</h2>
      <button class="x" data-close>✕</button>
    </div>
    <div id="upload-body"></div>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <div id="print-area" class="print-only"></div>

  <script src="vendor/maplibre/maplibre-gl.js"></script>
  <script src="js/config.js"></script>
  <script src="data/bundled.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/pdfparse.js"></script>
  <script src="js/store.js"></script>
  <script src="js/brief.js"></script>
  <script src="js/app.js"></script>
  <script src="js/upload.js"></script>
</body>
</html>

<body class="landing">
  <div class="intro" id="intro" role="presentation">
    <div class="intro-stage" aria-hidden="true">
      <svg class="intro-horizon" viewBox="0 0 1000 120" preserveAspectRatio="none"><path d="M0 40 Q 500 0 1000 70"/></svg>
      <span class="intro-ripple"></span>
      <img class="intro-drop" src="img/brand/logo-128.png" alt="">
      <div class="intro-name"><b>JalDrishti</b><span></span></div>
    </div>
    <button class="intro-skip" type="button">Skip intro</button>
  </div>
  <script src="js/intro.js"></script>
  <header class="l-top">
    <a class="l-brand" href="index.html">
      <img class="brand-logo" src="img/brand/logo-128.png" width="40" height="40" alt="" data-alt="logoAlt">
      <span data-t="appName"></span>
    </a>
    <div class="l-controls">
      <div class="seg" role="group" aria-label="Theme">
        <button data-theme-btn="light" aria-label="Light theme">☀</button>
        <button data-theme-btn="dark" aria-label="Dark theme">☾</button>
      </div>
      <div class="seg" role="group" aria-label="Language / भाषा">
        <button data-lang-btn="en" lang="en">EN</button>
        <button data-lang-btn="hi" lang="hi">हिंदी</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-h">
      <div id="hero-map" class="hero-map" aria-hidden="true"></div>
      <div class="hero-scrim"></div>

          <p class="hero-lede" id="hero-lede"></p>

            <a class="btn btn-ghost" href="app.html#alerts" id="cta-alerts"></a>
          </div>
        </div>
        <aside class="gauge" aria-labelledby="gauge-h">
          <h2 id="gauge-h"></h2>
          <ol id="gauge-list"></ol>
          <p class="gauge-note" id="gauge-note"></p>
          <button class="motion-btn" id="motion-btn" hidden></button>
        </aside>
      </div>
    </section>

    <section class="l-band">
      <div class="l-band-inner">
        <div>
          <h2 id="band-h"></h2>
          <p id="band-p"></p>
        </div>
        <ul class="l-facts" id="band-facts"></ul>
      </div>
    </section>
  </main>

  <footer class="l-foot">
    <p id="foot-p"></p>
